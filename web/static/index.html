<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autonoma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="grain"></div>
    </div>

    <div class="frame">
      <nav class="agent-rail" aria-label="Agents">
        <div class="rail-brand">
          <p class="presence" id="presence">
            <span class="pulse" aria-hidden="true"></span>
            <span id="presence-label">Standing by</span>
          </p>
          <h1 class="brand">Autonoma</h1>
        </div>
        <div class="agent-list" id="agent-list"></div>
      </nav>

      <div class="shell">
        <header class="top">
          <p class="tagline" id="active-agent-label">Personal assistant</p>
          <div class="top-actions">
            <button
              type="button"
              class="ghost history-toggle"
              id="history-toggle"
              aria-expanded="true"
              aria-controls="history-panel"
            >
              Conversations
            </button>
            <button type="button" class="ghost" id="reset-btn" title="Start a new conversation">
              New conversation
            </button>
          </div>
        </header>

        <main class="stage" id="stage">
          <div class="welcome" id="welcome">
            <p class="welcome-kicker">Ready when you are</p>
            <h2 class="welcome-title">What should we take care of?</h2>
            <div class="starters" id="starters">
              <button
                type="button"
                data-prompt="Remember that I prefer concise answers and Python for code."
              >
                Remember my preferences
              </button>
              <button
                type="button"
                data-prompt="Research what personal AI agents can do today and give me a short briefing."
              >
                Brief me on personal AI agents
              </button>
              <button
                type="button"
                data-prompt="Write a small Python function that retries an API call with backoff."
              >
                Write a retry helper
              </button>
              <button
                type="button"
                data-prompt="Mean and trend of these monthly numbers: 120, 135, 128, 150, 170, 165."
              >
                Analyze these numbers
              </button>
            </div>
          </div>
          <div class="thread" id="thread" hidden></div>
        </main>

        <div class="activity" id="activity" hidden>
          <span class="activity-dot"></span>
          <span id="activity-text">Working…</span>
        </div>

        <footer class="composer">
          <form id="chat-form" autocomplete="off">
            <label class="sr-only" for="message">Message</label>
            <textarea
              id="message"
              rows="1"
              placeholder="Ask Autonoma anything — goals, tasks, questions…"
              required
            ></textarea>
            <button type="submit" id="send-btn" aria-label="Send">
              <span>Send</span>
            </button>
          </form>
          <p class="status-line">
            <span id="mode-label">Checking connection…</span>
            <span class="sep">·</span>
            <label class="offline-toggle">
              <input type="checkbox" id="offline" />
              Offline demo
            </label>
          </p>
        </footer>
      </div>

      <aside class="history-panel is-open" id="history-panel" aria-label="Previous conversations">
        <div class="history-head">
          <h2>Conversations</h2>
          <p>Earlier chats stay here when you start a new one.</p>
        </div>
        <div class="history-list" id="history-list">
          <p class="history-empty" id="history-empty">No conversations yet.</p>
        </div>
      </aside>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
